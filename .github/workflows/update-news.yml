name: Update Alexa morning news

on:
  workflow_dispatch:
  schedule:
    # Sunday–Thursday 21:00 UTC = Monday–Friday 06:00 JST.
    - cron: '0 21 * * 0-4'

permissions:
  contents: read

concurrency:
  group: alexa-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo '::error::Register GEMINI_API_KEY in Settings > Secrets and variables > Actions.'
            exit 1
          fi
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Generate and validate grounded news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
        run: python generate_news.py
      - name: Save feed and sources on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/feed.json docs/index.html docs/grounding.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Alexa morning news'
            git push origin HEAD:main
          fi
      - name: Save reviewable output
        uses: actions/upload-artifact@v4
        with:
          name: alexa-news
          path: docs/
          retention-days: 7
      - name: Package Pages site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: update-news
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated docs
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: alexa-news
          path: expected-news
      - name: Verify public feed matches this run
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python verify_public_feed.py
